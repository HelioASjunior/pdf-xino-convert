    <!-- GitHub Pages SPA: decode the path that 404.html encoded as a query string.

    <script>

        if (l.search[1] === '/') {
          var segments = l.pathname.split('/').filter(Boolean);
          var repoBase = l.hostname.endsWith('github.io') && segments.length > 0 ? '/' + segments[0] : '';

            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, repoBase + decoded + l.hash);
        }
      }(window.location));
